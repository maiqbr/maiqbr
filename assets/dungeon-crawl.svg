<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Maiq's dungeon crawl</title>
  <desc id="desc">An animated adventurer travels through a purple and gold pixel-art dungeon toward a treasure chest.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#20162f"/><stop offset="1" stop-color="#100b18"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#37234f"/><stop offset="1" stop-color="#21142f"/></linearGradient>
    <pattern id="tiles" width="48" height="30" patternUnits="userSpaceOnUse"><path d="M0 1h47v28H0z" fill="none" stroke="#5e4382" stroke-opacity=".65"/><path d="M24 1v28" stroke="#5e4382" stroke-opacity=".25"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="220" rx="14" fill="url(#wall)"/>
  <path d="M0 75h1200v105H0z" fill="url(#floor)"/><path d="M0 75h1200v105H0z" fill="url(#tiles)"/>
  <path d="M0 75h1200M0 180h1200" stroke="#8f6bc3" stroke-opacity=".65" stroke-width="3"/>
  <g fill="#76519d" opacity=".45"><path d="M25 56h65v19H25zM157 37h78v38h-78zM318 51h85v24h-85zM516 34h98v41h-98zM751 51h72v24h-72zM935 34h93v41h-93zM1106 56h69v19h-69z"/></g>
  <g font-family="monospace" font-size="13" letter-spacing="2"><text x="32" y="35" fill="#dbcaff">DUNGEON CRAWL</text><text x="1168" y="35" text-anchor="end" fill="#b79ad9">LOOT: IDEAS +1</text></g>
  <g filter="url(#glow)"><circle cx="125" cy="92" r="9" fill="#f4b942"><animate attributeName="r" values="8;12;8" dur="1.1s" repeatCount="indefinite"/></circle><circle cx="430" cy="92" r="9" fill="#f4b942"><animate attributeName="r" values="12;8;12" dur="1.3s" repeatCount="indefinite"/></circle><circle cx="785" cy="92" r="9" fill="#f4b942"><animate attributeName="r" values="8;12;8" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="1070" cy="92" r="9" fill="#f4b942"><animate attributeName="r" values="12;8;12" dur="1s" repeatCount="indefinite"/></circle></g>
  <g fill="#c99231"><path d="M120 100h10v20h-10zm305 0h10v20h-10zm355 0h10v20h-10zm285 0h10v20h-10z"/></g>
  <g transform="translate(1080 118)"><path d="M0 16h55v37H0z" fill="#9a642b" stroke="#f2c35f" stroke-width="3"/><path d="M0 16h55v10H0z" fill="#dca33d"/><path d="M24 8h8v45h-8z" fill="#f2c35f"/><path d="M21 30h14v11H21z" fill="#3b234e"/><path d="M18 0h20v10H18z" fill="#c88b2e"/></g>
  <g fill="#9b7bff" opacity=".9"><circle cx="610" cy="145" r="3"><animate attributeName="opacity" values=".2;1;.2" dur=".9s" repeatCount="indefinite"/></circle><circle cx="655" cy="130" r="2"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle><circle cx="705" cy="153" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle></g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="70 0;1000 0;1000 0;70 0" keyTimes="0;.62;.76;1" dur="12s" repeatCount="indefinite"/>
    <g transform="translate(0 118)"><path d="M4 29h42v18H4z" fill="#5c3f83"/><path d="M12 8h27v31H12z" fill="#9b7bff" stroke="#ebddff" stroke-width="3"/><path d="M18 0h15v12H18z" fill="#f2c35f"/><circle cx="22" cy="22" r="3" fill="#171024"/><circle cx="31" cy="22" r="3" fill="#171024"/><path d="M18 31h17" stroke="#171024" stroke-width="3"/><path d="M0 47h16v8H0zm34 0h16v8H34z" fill="#f2c35f"/><path d="M-7 17H7" stroke="#ebddff" stroke-width="4"/><path d="M-10 8l12 9-12 9z" fill="#ebddff"/></g>
  </g>
  <rect x="1" y="1" width="1198" height="218" rx="13" fill="none" stroke="#8b68bf" stroke-opacity=".7" stroke-width="2"/>
